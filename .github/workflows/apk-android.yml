# Construye el APK de ORI automáticamente en GitHub (sin instalar Android Studio).
# GitHub → pestaña Actions → "APK Android de ORI" → Run workflow → descargue el APK en "Artifacts".
name: APK Android de ORI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["movil/**", "escritorio/renderer/**", ".github/workflows/apk-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar interfaz
        run: npm run preparar

      - name: Crear proyecto Android
        run: |
          npx cap add android
          # Permiso de micrófono para hablar con ORI
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK
        working-directory: movil/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ORI-Orion-Nova-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
